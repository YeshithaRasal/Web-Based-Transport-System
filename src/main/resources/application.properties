# ===================================================================
# Swift Go Lanka - Web-Based Transport Management System Configuration
# ===================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=

# Database Configuration (H2)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
# (Optional) H2 console available at /h2-console

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# Logging Settings
logging.level.root=INFO
logging.level.lk.swiftgolanka=DEBUG
logging.level.org.springframework.security=INFO

# Application Specific Properties
swiftgolanka.app.name=Swift Go Lanka
swiftgolanka.app.currency=Rs.
swiftgolanka.app.driver-commission-pct=15.0
