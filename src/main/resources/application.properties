# ===================================================================
# Swift Go Lanka - Web-Based Transport Management System Configuration
# ===================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=

# Database Configuration (MySQL)
# Default DB Name: swift_go_lanka
spring.datasource.url=jdbc:mysql://localhost:3306/swift_go_lanka?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=16261
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# Logging Settings
logging.level.root=INFO
logging.level.lk.swiftgolanka=DEBUG
logging.level.org.springframework.security=INFO

# Application Specific Properties
swiftgolanka.app.name=Swift Go Lanka
swiftgolanka.app.currency=Rs.
swiftgolanka.app.driver-commission-pct=15.0
