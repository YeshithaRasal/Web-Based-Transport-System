<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Swift Go Lanka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center align-items-center py-5">

<div class="container text-center">
    <div class="glass-card p-5 mx-auto" style="max-width: 550px;">
        <div class="display-1 text-danger mb-3"><i class="bi bi-exclamation-octagon-fill"></i></div>
        <h1 class="fw-bold mb-2 text-white" th:text="${status} + ' - ' + ${error}">500 - Error</h1>
        <p class="text-muted mb-4 fs-5" th:text="${message}">An unexpected issue occurred.</p>
        <a th:href="@{/}" class="btn btn-primary-swift px-4 py-2">
            <i class="bi bi-house-door me-2"></i> Return to Dashboard
        </a>
    </div>
</div>

</body>
</html>
