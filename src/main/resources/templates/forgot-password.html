<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Swift Go Lanka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center align-items-center py-4">

<div class="container">
    <div class="auth-container">
        <div class="glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle mb-3" style="background: rgba(6, 182, 212, 0.12); border: 1px solid rgba(6, 182, 212, 0.35); box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);">
                    <i class="bi bi-key-fill fs-1" style="color: var(--primary-cyan);"></i>
                </div>
                <h3 class="fw-bold mb-1 text-white">Reset Password</h3>
                <p class="text-muted small">Enter your registered email address to receive password recovery instructions.</p>
            </div>

            <form th:action="@{/forgot-password}" method="post">
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-envelope me-1 text-muted"></i> Registered Email</label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <button type="submit" class="btn btn-primary-swift w-100 py-2 mt-2 mb-3">
                    <i class="bi bi-envelope-check me-2"></i> Send Recovery Link
                </button>
            </form>

            <div class="text-center mt-3 border-top border-secondary pt-3">
                <a th:href="@{/login}" class="text-decoration-none small fw-medium" style="color: var(--primary-cyan);"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
