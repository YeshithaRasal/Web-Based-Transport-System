<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Swift Go Lanka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center align-items-center py-4">

<div class="container">
    <div class="auth-container">
        <div class="glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle mb-3" style="background: rgba(6, 182, 212, 0.12); border: 1px solid rgba(6, 182, 212, 0.35); box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);">
                    <i class="bi bi-taxi-front-fill fs-1" style="color: var(--primary-cyan);"></i>
                </div>
                <h2 class="fw-bold mb-1 text-white">Swift Go Lanka</h2>
                <p class="text-muted small">Smart Transport & Mobility Platform</p>
            </div>

            <!-- Alert Messages -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-envelope me-1 text-muted"></i> Email Address</label>
                    <input type="email" name="username" class="form-control" placeholder="name@swiftgolanka.lk" required autofocus>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label class="form-label mb-0"><i class="bi bi-lock me-1 text-muted"></i> Password</label>
                        <a th:href="@{/forgot-password}" class="text-decoration-none small fw-medium" style="color: var(--primary-cyan);">Forgot?</a>
                    </div>
                    <input type="password" name="password" class="form-control mt-1" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary-swift w-100 py-2 mt-3 mb-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Account
                </button>
            </form>

            <div class="border-top border-secondary pt-3 mt-3 text-center">
                <p class="text-muted mb-2 small">New to Swift Go Lanka?</p>
                <div class="d-flex gap-2 justify-content-center">
                    <a th:href="@{/register/passenger}" class="btn btn-sm btn-secondary-swift px-3">
                        <i class="bi bi-person-plus me-1 text-info"></i> Register Passenger
                    </a>
                    <a th:href="@{/register/driver}" class="btn btn-sm btn-secondary-swift px-3">
                        <i class="bi bi-car-front me-1 text-success"></i> Register Driver
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
