<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Official Payment Receipt - Swift Go Lanka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body { background-color: #0b1120 !important; color: #cbd5e1; padding: 2rem; font-family: 'Inter', sans-serif; }
        .receipt-card { 
            max-width: 580px; 
            margin: 0 auto; 
            background: #131c31; 
            border-radius: 16px; 
            border: 1px solid #1e2c46; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
            padding: 2.5rem; 
        }
        .trip-breakdown {
            background-color: #0e1627;
            border: 1px solid #1e2c46;
            border-radius: 12px;
            padding: 1.25rem;
        }
        @media print {
            body { background: #ffffff !important; color: #000000 !important; padding: 0; }
            .receipt-card { border: none !important; box-shadow: none !important; max-width: 100% !important; padding: 1rem; }
            .no-print { display: none !important; }
            .trip-breakdown { background: #f8fafc !important; border: 1px solid #cbd5e1 !important; color: #000 !important; }
            .text-white, .text-dark { color: #000 !important; }
        }
    </style>
</head>
<body>

    <div class="receipt-card">
        <div class="text-center border-bottom pb-3 mb-4" style="border-color: #1e2c46 !important;">
            <div class="d-inline-flex align-items-center justify-content-center p-2 rounded-circle mb-2" style="background: rgba(6, 182, 212, 0.12); border: 1px solid rgba(6, 182, 212, 0.35);">
                <i class="bi bi-taxi-front-fill fs-3" style="color: var(--primary-cyan);"></i>
            </div>
            <h3 class="fw-bold mb-1 text-white">Swift Go Lanka</h3>
            <p class="text-muted mb-0 small">Official Transport & Payment Receipt</p>
            <div class="badge bg-success mt-2 py-2 px-3 fs-6">PAYMENT COMPLETED</div>
        </div>

        <div class="row mb-3">
            <div class="col-6">
                <small class="text-muted d-block">Transaction Ref:</small>
                <strong class="font-monospace text-primary" th:text="${payment.transactionReference}">TXN-1234</strong>
            </div>
            <div class="col-6 text-end">
                <small class="text-muted d-block">Paid Date & Time:</small>
                <strong class="text-white" th:text="${#temporals.format(payment.paidAt, 'dd-MMM-yyyy HH:mm')}">Date</strong>
            </div>
        </div>

        <div class="trip-breakdown mb-4">
            <h6 class="fw-bold mb-3 text-white"><i class="bi bi-geo-alt-fill me-1" style="color: var(--primary-cyan);"></i> Trip Breakdown:</h6>
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Passenger:</span>
                <strong class="text-white" th:text="${payment.passenger.fullName}">Passenger Name</strong>
            </div>
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Driver:</span>
                <strong class="text-white" th:text="${payment.trip.driver.user.fullName}">Driver Name</strong>
            </div>
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Vehicle:</span>
                <span class="text-white" th:text="${payment.trip.driver.vehicleNumber} + ' (' + ${payment.trip.driver.vehicleType} + ')'">CAB-1234</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Route:</span>
                <span class="fw-semibold text-white" th:text="${payment.trip.pickupLocation} + ' ➔ ' + ${payment.trip.destinationLocation}">Route</span>
            </div>
            <div class="d-flex justify-content-between">
                <span class="text-muted">Distance:</span>
                <span class="text-white" th:text="${payment.trip.distanceKm} + ' km'">3.5 km</span>
            </div>
        </div>

        <div class="border-top border-bottom py-3 mb-4" style="border-color: #1e2c46 !important;">
            <div class="d-flex justify-content-between align-items-center fs-4 fw-bold">
                <span class="text-white">Total Paid:</span>
                <span class="text-success font-monospace" th:text="'Rs. ' + ${#numbers.formatDecimal(payment.amount, 1, 2)}">Rs. 500.00</span>
            </div>
            <small class="text-muted">Paid via <span class="badge bg-secondary" th:text="${payment.paymentMethod}">CREDIT_CARD</span></small>
        </div>

        <div class="text-center no-print">
            <button onclick="window.print()" class="btn btn-primary-swift me-2"><i class="bi bi-printer me-1"></i> Print Receipt</button>
            <button onclick="window.close()" class="btn btn-secondary-swift">Close</button>
        </div>
    </div>

</body>
</html>
