<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Official Payment Receipt - Swift Go Lanka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; color: #1e293b; padding: 2rem; font-family: 'Inter', sans-serif; }
        .receipt-card { max-width: 580px; margin: 0 auto; background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.08); padding: 2.5rem; }
    </style>
</head>
<body>

    <div class="receipt-card">
        <div class="text-center border-bottom pb-3 mb-4">
            <h3 class="fw-bold text-primary mb-1"><i class="bi bi-taxi-front-fill me-2"></i>Swift Go Lanka</h3>
            <p class="text-muted mb-0 small">Official Transport & Payment Receipt</p>
            <div class="badge bg-success mt-2 py-2 px-3">PAYMENT COMPLETED</div>
        </div>

        <div class="row mb-3">
            <div class="col-6">
                <small class="text-muted d-block">Transaction Ref:</small>
                <strong class="font-monospace text-dark" th:text="${payment.transactionReference}">TXN-1234</strong>
            </div>
            <div class="col-6 text-end">
                <small class="text-muted d-block">Paid Date & Time:</small>
                <strong th:text="${#temporals.format(payment.paidAt, 'dd-MMM-yyyy HH:mm')}">Date</strong>
            </div>
        </div>

        <div class="bg-light p-3 rounded mb-4">
            <h6 class="fw-bold mb-2 text-secondary">Trip Breakdown:</h6>
            <div class="d-flex justify-content-between mb-1">
                <span>Passenger:</span>
                <strong th:text="${payment.passenger.fullName}">Passenger Name</strong>
            </div>
            <div class="d-flex justify-content-between mb-1">
                <span>Driver:</span>
                <strong th:text="${payment.trip.driver.user.fullName}">Driver Name</strong>
            </div>
            <div class="d-flex justify-content-between mb-1">
                <span>Vehicle:</span>
                <span th:text="${payment.trip.driver.vehicleNumber} + ' (' + ${payment.trip.driver.vehicleType} + ')'">CAB-1234</span>
            </div>
            <div class="d-flex justify-content-between mb-1">
                <span>Route:</span>
                <span th:text="${payment.trip.pickupLocation} + ' ➔ ' + ${payment.trip.destinationLocation}">Route</span>
            </div>
            <div class="d-flex justify-content-between">
                <span>Distance:</span>
                <span th:text="${payment.trip.distanceKm} + ' km'">3.5 km</span>
            </div>
        </div>

        <div class="border-top border-bottom py-3 mb-4">
            <div class="d-flex justify-content-between align-items-center fs-4 fw-bold">
                <span>Total Paid:</span>
                <span class="text-success" th:text="'Rs. ' + ${payment.amount}">Rs. 500.00</span>
            </div>
            <small class="text-muted">Paid via <span th:text="${payment.paymentMethod}">CREDIT_CARD</span></small>
        </div>

        <div class="text-center no-print">
            <button onclick="window.print()" class="btn btn-primary me-2"><i class="bi bi-printer me-1"></i> Print Receipt</button>
            <button onclick="window.close()" class="btn btn-outline-secondary">Close</button>
        </div>
    </div>

</body>
</html>
