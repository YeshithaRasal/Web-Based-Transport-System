<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - Swift Go Lanka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg modern-nav sticky-top py-2 px-3">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/}">
            <i class="bi bi-arrow-left-circle me-2" style="color: var(--primary-cyan);"></i>
            <span class="text-white">Swift Go Lanka</span>
            <span class="badge bg-secondary ms-2">Account Settings</span>
        </a>
        <div class="d-flex align-items-center gap-2">
            <a th:href="@{/logout}" class="btn btn-sm btn-outline-danger"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="row g-4 justify-content-center">

        <div class="col-lg-6">
            <!-- Flash Alerts -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="glass-card p-4 p-md-5 mb-4">
                <h4 class="fw-bold mb-4 text-white"><i class="bi bi-person-gear me-2" style="color: var(--primary-cyan);"></i>Profile Details</h4>

                <form th:action="@{/profile/update}" th:object="${profileDTO}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Full Name</label>
                        <input type="text" th:field="*{fullName}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Email Address</label>
                        <input type="email" th:field="*{email}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Phone Number</label>
                        <input type="text" th:field="*{phone}" class="form-control" required>
                    </div>

                    <!-- Driver specific details if driver -->
                    <div th:if="${driverProfile != null}">
                        <hr class="my-4">
                        <h6 class="text-warning fw-bold mb-3"><i class="bi bi-car-front me-1"></i> Vehicle & Licence Information</h6>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label small fw-semibold">Licence Number</label>
                                <input type="text" th:field="*{licenceNumber}" class="form-control form-control-sm">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label small fw-semibold">Vehicle Number</label>
                                <input type="text" th:field="*{vehicleNumber}" class="form-control form-control-sm">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label small fw-semibold">Vehicle Model</label>
                                <input type="text" th:field="*{vehicleModel}" class="form-control form-control-sm">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label small fw-semibold">Vehicle Colour</label>
                                <input type="text" th:field="*{vehicleColour}" class="form-control form-control-sm">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-swift w-100 py-2 mt-2">Save Profile Updates</button>
                </form>
            </div>

            <!-- Password Change Form -->
            <div class="glass-card p-4 p-md-5">
                <h4 class="fw-bold text-white mb-4"><i class="bi bi-shield-lock text-warning me-2"></i>Change Password</h4>
                <form th:action="@{/profile/password}" th:object="${passwordDTO}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Current Password</label>
                        <input type="password" th:field="*{currentPassword}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">New Password</label>
                        <input type="password" th:field="*{newPassword}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Confirm New Password</label>
                        <input type="password" th:field="*{confirmPassword}" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-warning text-dark fw-bold w-100 py-2">Update Password</button>
                </form>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
